# Tests und Lint der Werkbank selbst
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Ohne --frozen-lockfile, bis bun.lock im Repository liegt (README, „Noch offen“)
      - run: bun install
      - run: bun run lint
      - run: bun run test
